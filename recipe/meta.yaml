{% set name = "calliope" %}
{% set version = "0.7.0" %}
{% set sha256 = "58e4ba08dfda4d5b30b5169876126d6d72131b6d521a684f352bd49a75216be4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  noarch: python
  entry_points:
    - calliope = calliope.cli:cli

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }},<3.10
    - bottleneck <2
    - click >=8,<9
    - hdf5 <2.0
    - ipython >=7,<9
    - ipdb >=0.13,<1.0
    - jinja2 >=2.10,<4
    - libnetcdf <4.9
    - natsort >=5,<9
    - netcdf4 >=1.2.2,<2.0
    - numpy >=1.23,<1.24
    - pandas >=1.5,<1.6
    - plotly >=3.10,<3.11
    - pyomo >=6.4,<6.5
    - ruamel.yaml >=0.17,<0.18
    - scikit-learn >=1.2,<1.3
    - xarray >=2022.3,<2022.4
  run_constrained:
    - glpk >=5,<5.1

test:
  requires:
    - python {{ python_min }}
  imports:
    - calliope
  commands:
    - calliope --help

about:
  home: https://www.callio.pe/
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: A multi-scale energy systems modelling framework
  description: |
    Calliope is a framework to develop energy system models, with a
    focus on flexibility, high spatial and temporal resolution, the
    ability to execute many runs based on the same base model, and
    a clear separation of framework (code) and model (data).
  doc_url: https://calliope.readthedocs.io/
  dev_url: https://github.com/calliope-project/calliope

extra:
  recipe-maintainers:
    - sjpfenninger
    - brynpickering
