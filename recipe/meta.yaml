{% set name = "calliope" %}
{% set pypi_version = "0.7.0.dev6" %}
{% set conda_version = "0.7.0dev6" %}
{% set sha256 = "d372bd3ad5021f2d1d4aa8e7ce1d92dcde8fe7d28b6c8b1221967dd2e5b58f20" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ conda_version }}

source:
  fn: {{ name }}-{{ pypi_version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ pypi_version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv
  noarch: python
  entry_points:
    - calliope = calliope.cli:cli

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - bottleneck >=1
    - click >=8
    - geographiclib >=2
    - hdf5 >=1
    - ipdb >=0.13
    - ipykernel >=6
    - jinja2 >=3
    - jsonref >=1.1
    - jsonschema >=4
    - libnetcdf >=4
    - natsort >=8
    - netcdf4 >=1.2
    - numpy >=1
    - pandas >=2.1.3
    - pydantic >=2.9.2
    - pyomo >=6.8.2
    - pyparsing >=3.2
    - ruamel.yaml >=0.18
    - typing-extensions >=4
    - xarray >=2024.1,<2024.4
  run_constrained:
    - glpk >=5,<5.1

test:
  requires:
    - python {{ python_min }}
  imports:
    - calliope
  commands:
    - calliope --help

about:
  home: https://www.callio.pe/
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: A multi-scale energy systems modelling framework
  description: |
    Calliope is a framework to develop energy system models, with a
    focus on flexibility, high spatial and temporal resolution, the
    ability to execute many runs based on the same base model, and
    a clear separation of framework (code) and model (data).
  doc_url: https://calliope.readthedocs.io/
  dev_url: https://github.com/calliope-project/calliope

extra:
  recipe-maintainers:
    - sjpfenninger
    - brynpickering
